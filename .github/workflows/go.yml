# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: AstraMind CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

on:
  push:
    branches:
      - main
      - feature/**
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  build-test-linux:
    runs-on: ubuntu-latest
    name: Build, Test & Coverage (Linux)
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build
      run: go run ./cmd/dev -run=build

    - name: Test
      run: go run ./cmd/dev -run=test

    - name: Coverage
      run: go run ./cmd/dev -run=coverage

    - name: Generate JUnit report
      if: always()
      run: go run ./cmd/dev -run=junit

    - name: Publish Test Report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'reports/junit.xml'
        check_name: 'Test Results (Linux)'

    - name: Upload Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports-linux
        path: |
          tests/output/coverage/
          reports/

  lint:
    runs-on: ubuntu-latest
    name: Lint (golangci-lint)
    timeout-minutes: 5
    # continue-on-error: this couldn't be verified locally against the
    # real codebase before adding it (network-restricted environment
    # during setup), so it's deliberately non-blocking until a real
    # run shows what it actually finds - remove this line once that's
    # confirmed clean, or fixed up if it finds real issues.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: latest
        args: --timeout=5m

  build-test-windows:
    runs-on: windows-latest
    name: Build & Test (Windows)
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build
      run: go run ./cmd/dev -run=build

    - name: Test
      run: go run ./cmd/dev -run=test

    - name: Generate JUnit report
      if: always()
      run: go run ./cmd/dev -run=junit

    - name: Publish Test Report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'reports/junit.xml'
        check_name: 'Test Results (Windows)'

    - name: Upload Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports-windows
        path: reports/